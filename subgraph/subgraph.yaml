specVersion: 0.0.7
schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: RideRegistry
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000" # TODO: replace
      abi: RideRegistry
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Ride
      abis:
        - name: RideRegistry
          file: ./abis/RideRegistry.json
      eventHandlers:
        - event: RidePosted(bytes32,address,address,uint256,bytes32,string,uint64)
          handler: handleRidePosted
        - event: RideAccepted(bytes32,address,string)
          handler: handleRideAccepted
      file: ./src/mappings.ts
